<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .msg { margin-top: 10px; padding: 8px; border-radius: 4px; display: none; }
        .success { background: #d4edda; color: #155724; display: block; }
        .error { background: #f8d7da; color: #721c24; display: block; }
        form { max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
        input { padding: 8px; }
    </style>
</head>
<body>
<h2>Регистрация</h2>
<form id="regForm">
    <input type="text" id="regName" placeholder="Ваше имя" required>
    <input type="email" id="regEmail" placeholder="Email (будет логином)" required>
    <input type="password" id="regPassword" placeholder="Пароль (минимум 8 символов)" required>
    <button type="submit">Зарегистрироваться</button>
</form>
<div id="regMsg" class="msg"></div>

<script>
    document.getElementById('regForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const loginEl = document.getElementById('regName');      // это будет login
        const emailEl = document.getElementById('regEmail');
        const passwordEl = document.getElementById('regPassword');
        const msg = document.getElementById('regMsg');

        if (!loginEl || !emailEl || !passwordEl || !msg) {
            console.error('Не найдены элементы формы регистрации');
            return;
        }

        const login = loginEl.value.trim();
        const email = emailEl.value.trim();
        const password = passwordEl.value;

        msg.className = 'msg';
        msg.textContent = '';

        // Валидация на клиенте
        if (!login || !email || !password) {
            msg.className = 'msg error';
            msg.textContent = 'Все поля обязательны: логин, email и пароль.';
            return;
        }
        if (password.length < 8) {
            msg.className = 'msg error';
            msg.textContent = 'Пароль должен быть минимум 8 символов.';
            return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            msg.className = 'msg error';
            msg.textContent = 'Некорректный email.';
            return;
        }

        try {
            const res = await fetch('/api/auth.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    action: 'register',
                    login: login,
                    email: email,
                    password: password
                })
            });

            const data = await res.json();

            if (data.success) {
                msg.className = 'msg success';
                msg.textContent = data.message;
                setTimeout(() => window.location.href = 'login.html', 1500);
            } else {
                msg.className = 'msg error';
                msg.textContent = data.message || 'Ошибка регистрации';
            }
        } catch (e) {
            console.error(e);
            msg.className = 'msg error';
            msg.textContent = 'Ошибка соединения. Проверьте консоль (F12).';
        }
    });
</script>
</body>
</html>
